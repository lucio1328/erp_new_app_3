<body>
<div th:fragment="contenu">
    <h2>Liste des employés</h2>

    <!-- 🔍 Formulaire de filtre -->

    <table>
        <thead>
        <tr>
            <th>Nom et Prénom</th>
            <th>Genre</th>
            <th>Date de naissance</th>
            <th>Email</th>
            <th>Département</th>
            <th>Poste</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td><a th:href="@{/employes/fiche/} + ${employee.name}"
                th:text="${employee.employeeName}"></a>
        </td>
            <td th:text="${employee.gender}"></td>
            <td th:text="${employee.dateOfBirth}"></td>
            <td th:text="${employee.companyEmail}"></td>
            <td th:text="${employee.department}"></td>
            <td th:text="${employee.designation}"></td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <span th:text="'Page ' + (${currentPage} + 1) + ' / ' + ${totalPages}"></span>

        <a th:if="${currentPage > 0}"
            th:href="@{/employes(page=${currentPage - 1}, size=10,
                        employeeName=${employeeName},
                        gender=${gender},
                        department=${department},
                        designation=${designation})}">Précédent</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/employes(page=${i}, size=10,
                            employeeName=${employeeName},
                            gender=${gender},
                            department=${department},
                            designation=${designation})}"
            th:text="${i + 1}"
            th:classappend="${i == currentPage} ? 'active' : ''"></a>
        </span>

        <a th:if="${currentPage + 1 < totalPages}"
            th:href="@{/employes(page=${currentPage + 1}, size=10,
                        employeeName=${employeeName},
                        gender=${gender},
                        department=${department},
                        designation=${designation})}">Suivant</a>
    </div>
</div>
</body>
</html>
