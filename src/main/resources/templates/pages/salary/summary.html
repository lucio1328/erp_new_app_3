<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Rapport des salaires</title>
    <link rel="stylesheet" th:href="@{/css/summary.css}">
</head>
<body>

<div class="page-header">
    <div class="container">
        <div class="header-content">
            <div>
                <h1 class="page-title">Tableau récapitulatif des paies</h1>
            </div>
        </div>

        <div th:if="${error != null}" class="alert-error">
            <div class="alert-content">
                <div class="alert-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="20" height="20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                </div>
                <p class="alert-message" th:text="${error}"></p>
            </div>
        </div>

        <div class="filter-form">
            <form action="/salary/summary" method="get" class="flex justify-between gap-6">
                <div class="form-group">
                    <label for="month" class="form-label">Mois</label>
                    <input type="month" name="month" id="month" class="form-input" />
                </div>

                <div class="flex items-center">
                    <button type="submit" class="form-button">
                        Filtrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container">
    <div class="table-container">
        <div style="overflow-x: auto;">
            <table class="table">
                <thead>
                    <tr>
                        <th>Employé</th>
                        <th>Entreprise</th>
                        <th>Période</th>
                        <th th:each="component : ${salaryComponents}" th:text="${component.name}"></th>
                        <th>Salaire Brut</th>
                        <th>Deduction</th>
                        <th>Net à Payer</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="slip : ${salarySlips}">
                        <td>
                            <div class="font-medium" th:text="${slip.employeeName}"></div>
                            <div class="text-xs text-gray-500" th:text="${slip.department} + ' - ' + ${slip.designation}"></div>
                        </td>
                        <td class="whitespace-nowrap text-sm text-gray-500" th:text="${slip.company}"></td>
                        <td class="whitespace-nowrap">
                            <span class="text-sm" th:text="${slip.startDate} + ' - ' + ${slip.endDate}"></span>
                            <div class="text-xs text-gray-500" th:text="${slip.payrollFrequency}"></div>
                        </td>
                        <td th:each="component : ${slip.componentsDef}"
                            th:text="${#numbers.formatDecimal(component, 1, 'POINT', 2, 'COMMA')} + ' ' + ${slip.currency}">
                        </td>
                        <td class="whitespace-nowrap text-right font-medium" th:text="${#numbers.formatDecimal(slip.grossPay, 1, 'POINT', 2, 'COMMA')} + ' ' + ${slip.currency}"></td>
                        <td class="whitespace-nowrap text-right font-semibold text-red" th:text="${#numbers.formatDecimal(slip.totalDeduction, 1, 'POINT', 2, 'COMMA')} + ' ' + ${slip.currency}"></td>
                        <td class="whitespace-nowrap text-right font-semibold text-green" th:text="${#numbers.formatDecimal(slip.netPay, 1, 'POINT', 2, 'COMMA')} + ' ' + ${slip.currency}"></td>
                        <td class="whitespace-nowrap text-sm text-gray-500" th:text="${slip.postingDate}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Section des totaux -->
        <div class="summary-section">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="summary-title">Récapitulatif des totaux</h3>
                </div>

                <div class="summary-grid">
                    <div th:each="component, stat : ${salaryComponents}" class="summary-card">
                        <div class="summary-label" th:text="${component.name}"></div>
                        <div class="summary-value"
                            th:text="${#numbers.formatDecimal(totalSalarySlip.componentsSum[stat.index], 1, 'POINT', 2, 'COMMA')} + ' ' + ${totalSalarySlip.currency}">
                        </div>
                    </div>

                    <!-- Total Brut -->
                    <div class="summary-card">
                        <div class="summary-label">Total Brut</div>
                        <div class="summary-value"
                            th:text="${#numbers.formatDecimal(totalSalarySlip.totalGrossPay, 1, 'POINT', 2, 'COMMA')} + ' ' + ${totalSalarySlip.currency}">
                        </div>
                    </div>

                    <!-- Total Déductions -->
                    <div class="summary-card">
                        <div class="summary-label">Total Déductions</div>
                        <div class="summary-value text-red"
                            th:text="${#numbers.formatDecimal(totalSalarySlip.totalDeductions, 1, 'POINT', 2, 'COMMA')} + ' ' + ${totalSalarySlip.currency}">
                        </div>
                    </div>

                    <!-- Total Net -->
                    <div class="summary-card">
                        <div class="summary-label">Net à Payer</div>
                        <div class="summary-value text-green"
                            th:text="${#numbers.formatDecimal(totalSalarySlip.totalNetPay, 1, 'POINT', 2, 'COMMA')} + ' ' + ${totalSalarySlip.currency}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="pagination">
            <div>
                <nav class="pagination-nav">
                    <a th:if="${currentPage > 0}"
                        th:href="@{/payrolls(page=${currentPage - 1}, size=${pageSize}, employee=${filter.employee}, startDate=${filter.startDate}, endDate=${filter.endDate})}"
                        class="pagination-button">
                        <svg class="pagination-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        Précédent
                    </a>

                    <span class="pagination-page">
                        Page <span th:text="${currentPage + 1}" style="font-weight: 600; margin-left: 4px;"></span>
                    </span>

                    <a th:href="@{/payrolls(page=${currentPage + 1}, size=${pageSize}, employee=${filter.employee}, startDate=${filter.startDate}, endDate=${filter.endDate})}"
                        class="pagination-button">
                        Suivant
                        <svg class="pagination-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </a>
                </nav>
            </div>
        </div>
    </div>
</div>

</body>
</html>
