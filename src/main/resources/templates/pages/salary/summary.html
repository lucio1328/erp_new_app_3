<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        .salary-summary {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        .filters {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .filter-group {
            display: inline-block;
            margin-right: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .total-row {
            font-weight: bold;
            background-color: #e6f7ff !important;
        }
        .currency {
            text-align: right;
        }
    </style>
</head>
<body>
<div class="salary-summary">
    <h2>Récapitulatif des Salaires</h2>

    <!-- Filtres -->
    <div class="filters">
        <form method="get" th:action="@{/salary/summary}">
            <div class="filter-group">
                <label for="month">Mois:</label>
                <select id="month" name="month">
                    <option th:each="m : ${months}"
                            th:value="${m}"
                            th:text="${T(java.time.Month).of(m).toString()}"
                            th:selected="${m == selectedMonth}"></option>
                </select>
            </div>

            <div class="filter-group">
                <label for="year">Année:</label>
                <select id="year" name="year">
                    <option th:each="y : ${years}"
                            th:value="${y}"
                            th:text="${y}"
                            th:selected="${y == selectedYear}"></option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Filtrer</button>
        </form>
    </div>

    <!-- Tableau des salaires -->
    <table>
        <thead>
            <tr>
                <th>Employé</th>
                <th>Matricule</th>
                <th>Département</th>
                <th class="currency">Salaire Brut</th>
                <!-- <th class="currency">Heures Supp.</th> -->
                <th class="currency">Déductions</th>
                <th class="currency">Net à Payer</th>
                <th class="currency">CTC</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="slip : ${salarySlips}">
                <td th:text="${slip.employeeName}">Nom Employé</td>
                <td th:text="${slip.employee}">EMP-001</td>
                <td th:text="${slip.department}">Département</td>
                <td class="currency" th:text="${#numbers.formatDecimal(slip.grossPay, 1, 2, 'COMMA')} + ' ' + ${slip.currency}">0,00 EURO</td>
                <!-- <td class="currency" th:text="${#numbers.formatDecimal(slip.totalWorkingHours - (slip.paymentDays * 8), 1, 2, 'COMMA')} + ' ' + ${slip.currency}">0,00 EURO</td> -->
                <td class="currency" th:text="${#numbers.formatDecimal(slip.totalDeduction, 1, 2, 'COMMA')} + ' ' + ${slip.currency}">0,00 EURO</td>
                <td class="currency" th:text="${#numbers.formatDecimal(slip.netPay, 1, 2, 'COMMA')} + ' ' + ${slip.currency}">0,00 EURO</td>
                <td class="currency" th:text="${#numbers.formatDecimal(slip.ctc, 1, 2, 'COMMA')} + ' ' + ${slip.currency}">0,00 EURO</td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="3"><center>Total</center></td>
                <!-- Salaire Brut -->
                <td class="currency"
                    th:text="${not salarySlips.empty}
                            ? ${#numbers.formatDecimal(totals.totalGrossPay, 1, 2, 'COMMA') + ' ' + salarySlips[0].currency} 
                            : '0,00 EURO'">
                </td>
                <!-- Déductions -->
                <td class="currency"
                    th:text="${not salarySlips.empty}
                            ? ${#numbers.formatDecimal(totals.totalDeductions, 1, 2, 'COMMA') + ' ' + salarySlips[0].currency} 
                            : '0,00 EURO'">
                </td>
                <!-- Net à Payer -->
                <td class="currency"
                    th:text="${not salarySlips.empty}
                            ? ${#numbers.formatDecimal(totals.totalNetPay, 1, 2, 'COMMA') + ' ' + salarySlips[0].currency} 
                            : '0,00 EURO'">
                </td>
                <!-- CTC -->
                <td class="currency"
                    th:text="${not salarySlips.empty}
                            ? ${#numbers.formatDecimal(totals.totalCtc, 1, 2, 'COMMA') + ' ' + salarySlips[0].currency} 
                            : '0,00 EURO'">
                </td>
            </tr>
        </tfoot>
    </table>
</div>
</body>
</html>
