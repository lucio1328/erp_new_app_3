<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Insertion Grille de Salaires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/payroll.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Nouvelle Grille de Salaires</h2>
        <form th:action="@{/grille/save}" method="post" id="salaryStructureForm">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">Détails de la Grille</div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Nom de la Grille*</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Société*</label>
                                <select class="form-select" name="company" required>
                                    <option value="">Sélectionner une société</option>
                                    <option th:each="company : ${companies}"
                                            th:value="${company.name}"
                                            th:text="${company.companyName}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Devise*</label>
                                <select class="form-select" name="currency" required>
                                    <option value="">Sélectionner une devise</option>
                                    <option th:each="currency : ${currencies}"
                                            th:value="${currency.name}"
                                            th:text="${currency.currencyName}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label">Fréquence de Paie*</label>
                                <select class="form-select" name="payFrequency" required>
                                    <option value="">Sélectionner une fréquence</option>
                                    <option th:each="freq : ${payFrequencies}"
                                            th:value="${freq}"
                                            th:text="${freq}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check mt-4 pt-2">
                                <input type="checkbox" class="form-check-input" name="isActive" id="isActive">
                                <label class="form-check-label" for="isActive">Grille Active</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Section Gains -->
            <div class="card mb-4">
                <div class="card-header bg-success text-white">Composantes de Gains</div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Composante</th>
                                <th>Description</th>
                                <th>Montant/Formule</th>
                                <th>Taxable</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="earning, stat : ${earningComponents}">
                                <td th:text="${earning.name}"></td>
                                <td th:text="${earning.description} ?: 'N/A'"></td>
                                <td>
                                    <input type="text" class="form-control" 
                                           th:name="earnings[__${stat.index}__].amount"
                                           th:value="${earning.amount}">
                                </td>
                                <td class="text-center">
                                    <input type="checkbox" class="form-check-input" 
                                           th:name="earnings[__${stat.index}__].isTaxApplicable"
                                           th:checked="${earning.isTaxApplicable == 1}">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Section Déductions -->
            <div class="card mb-4">
                <div class="card-header bg-danger text-white">Composantes de Déductions</div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Composante</th>
                                <th>Description</th>
                                <th>Montant/Formule</th>
                                <th>Taxable</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="deduction, stat : ${deductionComponents}">
                                <td th:text="${deduction.name}"></td>
                                <td th:text="${deduction.description} ?: 'N/A'"></td>
                                <td>
                                    <input type="text" class="form-control" 
                                           th:name="deductions[__${stat.index}__].amount"
                                           th:value="${deduction.amount}">
                                </td>
                                <td class="text-center">
                                    <input type="checkbox" class="form-check-input" 
                                           th:name="deductions[__${stat.index}__].isTaxApplicable"
                                           th:checked="${deduction.isTaxApplicable == 1}">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-outline-secondary">Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/salaryStructure.js}"></script>
</body>
</html>
